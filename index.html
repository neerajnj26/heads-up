    // --- SOUND ENGINE (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playPass() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.exponentialRampToValueAtTime(146.83, now + 0.2); // D3
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playTick() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
      playBuzzer() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(110, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // --- APP STATE MANAGER ---
    class HeadsUpApp {
      constructor() {
        this.sound = new SoundEngine();
        this.currentScreen = 'home'; // home, category, game, review
        this.selectedCategory = null;
        this.timerDuration = 60; // default 60s
        this.flipTilt = false;
        
        // Game state
        this.words = [];
        this.currentIndex = 0;
        this.score = 0;
        this.correctWords = [];
        this.passedWords = [];
        this.timeLeft = 60;
        this.timerInterval = null;
        this.isPlaying = false;
        
        // Tilt sensors
        this.isCalibrated = false;
        this.neutralBeta = 0; // forward/backward tilt
        this.tiltTriggered = false;
        this.boundHandleOrientation = this.handleOrientation.bind(this);

        this.loadCustomDeckFromStorage();
        this.render();
      }

      loadCustomDeckFromStorage() {
        try {
          const stored = localStorage.getItem('headsup_custom_deck');
          if (stored) {
            const list = JSON.parse(stored);
            if (list && list.length > 0) {
              // Add or update custom category
              let customCat = CATEGORIES.find(c => c.id === 'custom');
              if (!customCat) {
                customCat = {
                  id: 'custom',
                  name: 'Custom Inside Jokes',
                  icon: '✨',
                  gradient: 'from-purple-500 to-pink-600',
                  group: 'custom',
                  words: list
                };
                CATEGORIES.push(customCat);
              } else {
                customCat.words = list;
              }
            }
          }
        } catch(e) {
          console.error("Failed to load custom deck", e);
        }
      }

      toggleSound() {
        this.sound.enabled = !this.sound.enabled;
        const onIcon = document.getElementById('soundOnIcon');
        const offIcon = document.getElementById('soundOffIcon');
        if (this.sound.enabled) {
          onIcon.classList.remove('hidden');
          offIcon.classList.add('hidden');
        } else {
          onIcon.classList.add('hidden');
          offIcon.classList.remove('hidden');
        }
      }

      openCustomModal() {
        const modal = document.getElementById('customModal');
        const textarea = document.getElementById('customWordsInput');
        const customCat = CATEGORIES.find(c => c.id === 'custom');
        textarea.value = customCat ? customCat.words.join('\n') : '';
        this.updateCustomWordBadge();
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        textarea.oninput = () => this.updateCustomWordBadge();
      }

      updateCustomWordBadge() {
        const textarea = document.getElementById('customWordsInput');
        const badge = document.getElementById('customWordCountBadge');
        const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        badge.innerText = `${lines.length} word${lines.length === 1 ? '' : 's'} added`;
      }

      closeCustomModal() {
        const modal = document.getElementById('customModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }

      clearCustomDeck() {
        document.getElementById('customWordsInput').value = '';
        this.updateCustomWordBadge();
      }

      saveCustomDeck() {
        const textarea = document.getElementById('customWordsInput');
        const words = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (words.length === 0) {
          alert("Please add at least one word!");
          return;
        }
        localStorage.setItem('headsup_custom_deck', JSON.stringify(words));
        
        let customCat = CATEGORIES.find(c => c.id === 'custom');
        if (!customCat) {
          customCat = {
            id: 'custom',
            name: 'Custom Inside Jokes',
            icon: '✨',
            gradient: 'from-purple-500 to-pink-600',
            group: 'custom',
            words: words
          };
          CATEGORIES.push(customCat);
        } else {
          customCat.words = words;
        }

        this.closeCustomModal();
        this.render();
      }

      goHome() {
        this.stopGame();
        this.currentScreen = 'home';
        this.render();
      }

      selectCategory(catId) {
        const cat = CATEGORIES.find(c => c.id === catId);
        if (!cat || cat.words.length === 0) {
          if (catId === 'custom') {
            this.openCustomModal();
          } else {
            alert("This category is currently empty!");
          }
          return;
        }
        this.selectedCategory = cat;
        this.currentScreen = 'category';
        this.render();
      }

      setTimer(seconds) {
        this.timerDuration = seconds;
        // update active buttons in DOM if present
        document.querySelectorAll('.timer-btn').forEach(btn => {
          if (parseInt(btn.dataset.time) === seconds) {
            btn.className = "timer-btn flex-1 py-3 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition transform scale-105";
          } else {
            btn.className = "timer-btn flex-1 py-3 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 font-medium text-sm hover:border-slate-700 transition";
          }
        });
      }

      toggleFlipTilt() {
        this.flipTilt = !this.flipTilt;
        const checkbox = document.getElementById('flipTiltCheckbox');
        if (checkbox) checkbox.checked = this.flipTilt;
      }

      async startGame() {
        // Request motion permission on iOS if needed
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const response = await DeviceOrientationEvent.requestPermission();
            if (response !== 'granted') {
              alert("Motion permission denied. You can still use tap buttons or keyboard arrows!");
            }
          } catch(e) {
            console.error(e);
          }
        }

        this.score = 0;
        this.correctWords = [];
        this.passedWords = [];
        this.words = [...this.selectedCategory.words].sort(() => Math.random() - 0.5);
        this.currentIndex = 0;
        this.timeLeft = this.timerDuration;
        this.currentScreen = 'game';
        this.isPlaying = true;
        this.isCalibrated = false;
        this.tiltTriggered = false;

        this.render();
        this.startCountdownAndGame();
      }

      startCountdownAndGame() {
        const countdownEl = document.getElementById('countdownOverlay');
        const countNumber = document.getElementById('countNumber');
        let count = 3;

        this.sound.playTick();
        countNumber.innerText = count;

        const countInterval = setInterval(() => {
          count--;
          if (count > 0) {
            this.sound.playTick();
            countNumber.innerText = count;
          } else if (count === 0) {
            this.sound.playCorrect();
            countNumber.innerText = "GO!";
          } else {
            clearInterval(countInterval);
            countdownEl.classList.add('hidden');
            this.beginRoundTimer();
            this.initTiltSensors();
          }
        }, 1000);
      }

      beginRoundTimer() {
        this.timerInterval = setInterval(() => {
          this.timeLeft--;
          const timerEl = document.getElementById('gameTimer');
          if (timerEl) timerEl.innerText = this.timeLeft;

          if (this.timeLeft <= 5 && this.timeLeft > 0) {
            this.sound.playTick();
          }

          if (this.timeLeft <= 0) {
            this.endGame();
          }
        }, 1000);
      }

      initTiltSensors() {
        window.addEventListener('deviceorientation', this.boundHandleOrientation, true);
      }

      stopGame() {
        this.isPlaying = false;
        if (this.timerInterval) {
          clearInterval(this.timerInterval);
          this.timerInterval = null;
        }
        window.removeEventListener('deviceorientation', this.boundHandleOrientation, true);
      }

      handleOrientation(event) {
        if (!this.isPlaying) return;
        const beta = event.beta; // forward/backward tilt (-180 to 180)
        if (beta === null || beta === undefined) return;

        if (!this.isCalibrated) {
          this.neutralBeta = beta;
          this.isCalibrated = true;
          return;
        }

        const diff = beta - this.neutralBeta;
        const threshold = 25; // degrees tilt threshold

        if (!this.tiltTriggered) {
          let isDown = diff > threshold; // tilted screen down (forehead down)
          let isUp = diff < -threshold;   // tilted screen up (forehead up)

          if (this.flipTilt) {
            let temp = isDown;
            isDown = isUp;
            isUp = temp;
          }

          if (isDown) {
            this.tiltTriggered = true;
            this.markCorrect();
            setTimeout(() => { this.tiltTriggered = false; }, 800); // cooldown
          } else if (isUp) {
            this.tiltTriggered = true;
            this.markPass();
            setTimeout(() => { this.tiltTriggered = false; }, 800); // cooldown
          }
        }
      }

      markCorrect() {
        if (!this.isPlaying) return;
        this.sound.playCorrect();
        const word = this.words[this.currentIndex];
        this.score++;
        this.correctWords.push(word);
        this.flashScreen('correct');
        this.nextWord();
      }

      markPass() {
        if (!this.isPlaying) return;
        this.sound.playPass();
        const word = this.words[this.currentIndex];
        this.passedWords.push(word);
        this.flashScreen('pass');
        this.nextWord();
      }

      nextWord() {
        this.currentIndex++;
        if (this.currentIndex >= this.words.length) {
          // Shuffle and loop if words run out
          this.words = [...this.selectedCategory.words].sort(() => Math.random() - 0.5);
          this.currentIndex = 0;
        }
        const wordEl = document.getElementById('currentWordCard');
        if (wordEl) {
          wordEl.innerText = this.words[this.currentIndex];
        }
        const scoreEl = document.getElementById('liveScore');
        if (scoreEl) {
          scoreEl.innerText = this.score;
        }
      }

      flashScreen(type) {
        const flashEl = document.getElementById('screenFlash');
        if (!flashEl) return;
        flashEl.className = `absolute inset-0 pointer-events-none z-30 transition-colors duration-200 ${type === 'correct' ? 'bg-emerald-500/30' : 'bg-rose-500/30'}`;
        setTimeout(() => {
          flashEl.className = "absolute inset-0 pointer-events-none z-30";
        }, 200);
      }

      endGame() {
        this.stopGame();
        this.sound.playBuzzer();
        this.currentScreen = 'review';
        this.render();
      }

      // --- RENDER ROUTER ---
      render() {
        const main = document.getElementById('mainContent');
        main.innerHTML = '';

        if (this.currentScreen === 'home') {
          main.innerHTML = this.renderHomeScreen();
        } else if (this.currentScreen === 'category') {
          main.innerHTML = this.renderCategoryScreen();
        } else if (this.currentScreen === 'game') {
          main.innerHTML = this.renderGameScreen();
          this.attachGameKeyListeners();
        } else if (this.currentScreen === 'review') {
          main.innerHTML = this.renderReviewScreen();
        }
      }

      renderHomeScreen() {
        return `
          <div class="space-y-8">
            <!-- Hero banner -->
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-900/60 via-purple-900/60 to-slate-900 border border-slate-800 p-8 md:p-12 shadow-2xl">
              <div class="relative z-10 max-w-2xl">
                <span class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-4">
                  <span>🎉 Over 1,000+ Hilarious Prompts</span>
                </span>
                <h2 class="text-3xl md:text-5xl font-black tracking-tight text-white mb-4">Ready for the ultimate forehead guessing party?</h2>
                <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-6">Pick a category, hold your phone to your forehead, tilt down when correct and tilt up to pass! Works seamlessly on phones and laptops.</p>
                <div class="flex flex-wrap gap-4">
                  <button onclick="app.selectCategory('superstars')" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 hover:opacity-95 transition flex items-center space-x-2">
                    <span>🚀 Quick Play (Superstars)</span>
                  </button>
                  <button onclick="app.openCustomModal()" class="px-6 py-3 rounded-2xl bg-slate-900 border border-slate-700 text-slate-200 font-bold text-sm hover:border-slate-500 transition">
                    ✨ Add Custom Deck
                  </button>
                </div>
              </div>
              <div class="absolute -right-10 -bottom-10 opacity-10 pointer-events-none">
                <svg class="w-96 h-96 text-indigo-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/></svg>
              </div>
            </div>

            <!-- Category Groups -->
            <div>
              <h3 class="text-xl font-extrabold text-white mb-6 flex items-center space-x-2">
                <span>🔥 Choose a Category</span>
              </h3>
              
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                ${CATEGORIES.map(cat => `
                  <div onclick="app.selectCategory('${cat.id}')" class="group relative bg-slate-900/80 hover:bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-6 cursor-pointer transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/10 flex flex-col justify-between overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${cat.gradient} opacity-5 rounded-full blur-2xl group-hover:opacity-15 transition"></div>
                    <div class="flex items-start justify-between mb-4">
                      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center text-2xl shadow-lg">
                        ${cat.icon}
                      </div>
                      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 group-hover:text-indigo-400 uppercase tracking-wider transition">Play Deck</span>
                    </div>
                    <div>
                      <h4 class="text-lg font-bold text-white group-hover:text-indigo-300 transition mb-1">${cat.name}</h4>
                      <p class="text-xs text-slate-400">Curated fun & goofy prompts</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      renderCategoryScene() {} // alias

      renderCategoryScreen() {
        const cat = this.selectedCategory;
        return `
          <div class="max-w-xl mx-auto w-full space-y-6 pt-4 pb-12">
            <button onclick="app.goHome()" class="inline-flex items-center space-x-2 text-sm text-slate-400 hover:text-white transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
              <span>Back to Categories</span>
            </button>

            <!-- Category Card Header -->
            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-8 text-center relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-br ${cat.gradient} opacity-10"></div>
              <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br ${cat.gradient} flex items-center justify-center text-4xl mb-4 shadow-2xl">
                ${cat.icon}
              </div>
              <h2 class="text-2xl md:text-3xl font-black text-white mb-2">${cat.name}</h2>
              <p class="text-sm text-slate-400">${cat.words.length} hilarious prompts ready</p>
            </div>

            <!-- Settings -->
            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-6 space-y-6">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Round Duration</label>
                <div class="flex space-x-3">
                  <button onclick="app.setTimer(30)" data-time="30" class="timer-btn flex-1 py-3 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 font-medium text-sm hover:border-slate-700 transition">30s</button>
                  <button onclick="app.setTimer(60)" data-time="60" class="timer-btn flex-1 py-3 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition transform scale-105">60s</button>
                  <button onclick="app.setTimer(90)" data-time="90" class="timer-btn flex-1 py-3 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 font-medium text-sm hover:border-slate-700 transition">90s</button>
                  <button onclick="app.setTimer(120)" data-time="120" class="timer-btn flex-1 py-3 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 font-medium text-sm hover:border-slate-700 transition">120s</button>
                </div>
              </div>

              <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                <div>
                  <h4 class="text-sm font-bold text-white">Flip Tilt Direction</h4>
                  <p class="text-xs text-slate-400">If tilt scores the wrong way on your phone</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" id="flipTiltCheckbox" onchange="app.toggleFlipTilt()" class="sr-only peer" ${this.flipTilt ? 'checked' : ''}>
                  <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                </label>
              </div>
            </div>

            <!-- Ready Button -->
            <button onclick="app.startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-extrabold text-lg shadow-xl shadow-indigo-600/30 hover:opacity-95 transition transform active:scale-95">
              I'M READY! 🚀
            </button>
          </div>
        `;
      }

      renderGameScreen() {
        const currentWord = this.words[this.currentIndex] || "Ready";
        return `
          <div class="fixed inset-0 bg-slate-950 z-40 flex flex-col justify-between p-6 select-none overflow-hidden">
            <!-- Screen flash for correct/pass -->
            <div id="screenFlash" class="absolute inset-0 pointer-events-none z-30"></div>

            <!-- Top bar -->
            <div class="flex items-center justify-between z-20">
              <button onclick="app.goHome()" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-300 hover:text-white">Quit</button>
              <div class="flex items-center space-x-4 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl">
                <span class="text-xs text-slate-400 font-semibold">SCORE: <strong id="liveScore" class="text-emerald-400 text-base">${this.score}</strong></span>
                <span class="text-slate-700">|</span>
                <span class="text-xs text-slate-400 font-semibold">TIME: <strong id="gameTimer" class="text-indigo-400 text-base">${this.timeLeft}</strong>s</span>
              </div>
            </div>

            <!-- Center Countdown Overlay -->
            <div id="countdownOverlay" class="absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6">
              <div class="text-center space-y-4">
                <span class="text-xs font-bold uppercase tracking-widest text-indigo-400">Put phone to your forehead in 3... 2... 1...</span>
                <div id="countNumber" class="text-8xl md:text-9xl font-black text-white animate-pulse">3</div>
                <p class="text-sm text-slate-400 max-w-xs mx-auto">Tilt down when correct • Tilt up to pass</p>
              </div>
            </div>

            <!-- Word Card Display -->
            <div class="flex-1 flex flex-col items-center justify-center text-center px-4 z-20">
              <span class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-2">${this.selectedCategory.name}</span>
              <h2 id="currentWordCard" class="text-5xl md:text-8xl font-black tracking-tight text-white drop-shadow-lg leading-tight">${currentWord}</h2>
            </div>

            <!-- Bottom action buttons / tap zones -->
            <div class="grid grid-cols-2 gap-4 z-20 max-w-2xl mx-auto w-full">
              <button onclick="app.markPass()" class="py-5 rounded-2xl bg-rose-600/20 border border-rose-500/30 hover:bg-rose-600/30 text-rose-300 font-extrabold text-lg transition active:scale-95 flex items-center justify-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/></svg>
                <span>PASS (Tilt Up)</span>
              </button>
              <button onclick="app.markCorrect()" class="py-5 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 hover:bg-emerald-600/30 text-emerald-300 font-extrabold text-lg transition active:scale-95 flex items-center justify-center space-x-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                <span>CORRECT! (Tilt Down)</span>
              </button>
            </div>
          </div>
        `;
      }

      renderReviewScreen() {
        return `
          <div class="max-w-xl mx-auto w-full space-y-6 pt-4 pb-12">
            <!-- Header card -->
            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-8 text-center relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-br ${this.selectedCategory.gradient} opacity-10"></div>
              <span class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-1 block">Round Complete! 🎉</span>
              <h2 class="text-4xl md:text-5xl font-black text-white mb-2">${this.score} Correct</h2>
              <p class="text-sm text-slate-400">Great job playing ${this.selectedCategory.name}!</p>
            </div>

            <!-- Words Breakdown -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Correct words -->
              <div class="rounded-2xl bg-slate-900 border border-slate-800 p-5 space-y-3">
                <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center justify-between">
                  <span>✅ Correct (${this.correctWords.length})</span>
                </h4>
                <div class="max-h-60 overflow-y-auto space-y-1.5 pr-2">
                  ${this.correctWords.length === 0 ? '<p class="text-xs text-slate-500 italic">No words guessed correct.</p>' : this.correctWords.map(w => `
                    <div class="px-3 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-200 text-sm font-medium">${w}</div>
                  `).join('')}
                </div>
              </div>

              <!-- Passed words -->
              <div class="rounded-2xl bg-slate-900 border border-slate-800 p-5 space-y-3">
                <h4 class="text-xs font-bold uppercase tracking-wider text-rose-400 flex items-center justify-between">
                  <span>❌ Passed (${this.passedWords.length})</span>
                </h4>
                <div class="max-h-60 overflow-y-auto space-y-1.5 pr-2">
                  ${this.passedWords.length === 0 ? '<p class="text-xs text-slate-500 italic">No words passed!</p>' : this.passedWords.map(w => `
                    <div class="px-3 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm font-medium">${w}</div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex space-x-4">
              <button onclick="app.goHome()" class="flex-1 py-4 rounded-2xl bg-slate-900 border border-slate-800 text-white font-bold text-sm hover:border-slate-700 transition">
                Home
              </button>
              <button onclick="app.startGame()" class="flex-1 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition">
                Play Again 🚀
              </button>
            </div>
          </div>
        `;
      }

      attachGameKeyListeners() {
        window.onkeydown = (e) => {
          if (!this.isPlaying) return;
          if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            this.markCorrect();
          } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
            this.markPass();
          }
        };
      }
    }

    // Initialize application instance
    const app = new HeadsUpApp();
  </script>
</body>
</html>
